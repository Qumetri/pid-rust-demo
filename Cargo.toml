# Cargo.toml is the project manifest: name, version, and dependencies.
# It plays the role of CMakeLists.txt plus a package list.

[package]
name = "pid-rust-demo"
version = "0.1.0"
# The "edition" selects the language dialect. 2021 is supported by every
# Rust toolchain from the last few years, so it builds anywhere.
edition = "2021"
# The package has two programs: src/main.rs (terminal) and src/bin/ui.rs
# (window). This line says which one a plain `cargo run` starts.
default-run = "pid-rust-demo"

# Slint is the UI toolkit planned for the real project, so the window demo
# uses it too. The first build downloads and compiles it, which takes a
# few minutes once and is cached afterwards.
[dependencies]
slint = "1.19"

# Optional features, switched on with `cargo build --features kms`.
# `kms` adds Slint's linuxkms backend: it draws straight to the screen
# through DRM/KMS and reads touch through libinput, with no desktop.
# That is how the program runs on the Raspberry Pi with Pi OS Lite. The
# normal window backend stays enabled, so the same binary still opens a
# window on a Mac or PC.
[features]
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-femtovg"]
